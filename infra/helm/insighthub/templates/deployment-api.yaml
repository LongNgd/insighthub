apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insighthub.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.api.enabled }}
  replicas: {{ .Values.replicaCount.api }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "insighthub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret-provider: {{ include (print $.Template.BasePath "/secretproviderclass.yaml") . | sha256sum }}
      labels:
        {{- include "insighthub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "insighthub.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "insighthub.secretRenderer" . | nindent 8 }}
        - name: wait-for-schema
          image: {{ include "insighthub.image" .Values.images.migration | quote }}
          imagePullPolicy: {{ .Values.images.migration.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              . /runtime/secrets.env
              elapsed=0
              until [ "$(psql -X -qAt -c "SELECT to_regclass('public.documents') IS NOT NULL")" = "t" ]; do
                if [ "$elapsed" -ge {{ .Values.migration.waitTimeoutSeconds }} ]; then
                  echo "database schema was not ready before timeout" >&2
                  exit 1
                fi
                sleep 5
                elapsed=$((elapsed + 5))
              done
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.migration | nindent 12 }}
          volumeMounts:
            - name: runtime-secrets
              mountPath: /runtime
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: api
          image: {{ include "insighthub.image" .Values.images.api | quote }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - . /runtime/secrets.env; exec uvicorn app.main:app --host 0.0.0.0 --port 8000
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "insighthub.fullname" . }}-config
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          volumeMounts:
            - name: runtime-secrets
              mountPath: /runtime
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- include "insighthub.secretVolumes" . | nindent 8 }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
