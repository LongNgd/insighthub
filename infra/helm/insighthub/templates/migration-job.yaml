apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "insighthub.fullname" . }}-migration-{{ .Files.Get "files/init.sql" | sha256sum | trunc 8 }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "insighthub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "insighthub.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "insighthub.secretRenderer" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "insighthub.image" .Values.images.migration | quote }}
          imagePullPolicy: {{ .Values.images.migration.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - . /runtime/secrets.env; exec psql -X -v ON_ERROR_STOP=1 -f /migrations/init.sql
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.migration | nindent 12 }}
          volumeMounts:
            - name: runtime-secrets
              mountPath: /runtime
              readOnly: true
            - name: migrations
              mountPath: /migrations
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- include "insighthub.secretVolumes" . | nindent 8 }}
        - name: migrations
          configMap:
            name: {{ include "insighthub.fullname" . }}-migration
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
