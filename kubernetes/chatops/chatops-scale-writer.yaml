apiVersion: v1
kind: ServiceAccount
metadata:
  name: chatops-scale-writer
  namespace: insighthub-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chatops-scale-writer
  namespace: insighthub-prod
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chatops-scale-writer
  namespace: insighthub-prod
subjects:
  - kind: ServiceAccount
    name: chatops-scale-writer
    namespace: insighthub-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chatops-scale-writer
