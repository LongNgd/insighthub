nameOverride: ""

serviceAccount:
  create: true
  name: insighthub
  automountToken: false

images:
  web:
    repository: insighthub-web
    tag: local
    pullPolicy: IfNotPresent
  api:
    repository: insighthub-api
    tag: local
    pullPolicy: IfNotPresent
  worker:
    repository: insighthub-worker
    tag: local
    pullPolicy: IfNotPresent

app:
  existingSecret: insighthub-local-credentials
  databaseUrlKey: database-url
  redisUrlKey: redis-url
  config:
    RAG_MODE: fixture
    LLM_PROVIDER: fixture
    EMBEDDING_PROVIDER: fixture
    EMBEDDING_DIM: "1024"
    EMBEDDING_REVISION: "1"
    LOG_LEVEL: INFO
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi

web:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

monitoring:
  serviceMonitor:
    enabled: false
    additionalLabels: {}
    interval: 15s
    scrapeTimeout: 5s
  worker:
    enabled: false
    port: 9101
  exporters:
    postgres:
      enabled: false
      image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
    redis:
      enabled: false
      image: oliver006/redis_exporter:v1.92.0@sha256:ca3abd5f19da6c87e96038ba08aaa3dfaab34dc649834584c4d6880b05952fef
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi

postgres:
  enabled: true
  image: pgvector/pgvector:0.8.2-pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
  user: insighthub
  database: insighthub
  passwordSecretKey: postgres-password
  storage: 2Gi
  storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 768Mi

redis:
  enabled: true
  image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
  configSecretKey: redis.conf
  passwordSecretKey: redis-password
  storage: 1Gi
  storageClassName: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
