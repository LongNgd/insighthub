{{- if and .Values.postgres.enabled .Values.monitoring.exporters.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "insighthub.fullname" . }}-postgres-exporter
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-exporter
spec:
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
  selector:
    {{- include "insighthub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-exporter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insighthub.fullname" . }}-postgres-exporter
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "insighthub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres-exporter
  template:
    metadata:
      labels:
        {{- include "insighthub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: postgres-exporter
          image: {{ .Values.monitoring.exporters.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9187
          env:
            - name: DATA_SOURCE_URI
              value: {{ printf "%s-postgres:5432/%s?sslmode=disable" (include "insighthub.fullname" .) .Values.postgres.database | quote }}
            - name: DATA_SOURCE_USER
              value: {{ .Values.postgres.user | quote }}
            - name: DATA_SOURCE_PASS_FILE
              value: /etc/insighthub-monitoring/password
          volumeMounts:
            - name: password
              mountPath: /etc/insighthub-monitoring
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.monitoring.exporters.postgres.resources | nindent 12 }}
      volumes:
        - name: password
          secret:
            secretName: {{ .Values.app.existingSecret }}
            items:
              - key: {{ .Values.postgres.passwordSecretKey }}
                path: password
{{- end }}
