apiVersion: v1
kind: Service
metadata:
  name: {{ include "insighthub.fullname" . }}-api
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    {{- include "insighthub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insighthub.fullname" . }}-api
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "insighthub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "insighthub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ toJson .Values.app.config | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: api
          image: {{ include "insighthub.image" .Values.images.api | quote }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "insighthub.fullname" . }}-app
          env:
            {{- if .Values.day4Chaos.enabled }}
            - name: ENVIRONMENT
              value: day4-kind
            - name: DAY4_CHAOS_ENABLED
              value: "true"
            - name: DAY4_CHAOS_CONTROL_PATH
              value: /run/insighthub/day4/fault.json
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.existingSecret }}
                  key: {{ .Values.app.databaseUrlKey }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.existingSecret }}
                  key: {{ .Values.app.redisUrlKey }}
          {{- if .Values.day4Chaos.enabled }}
          volumeMounts:
            - name: day4-chaos
              mountPath: /run/insighthub/day4
              readOnly: true
          {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
      {{- if .Values.day4Chaos.enabled }}
      volumes:
        - name: day4-chaos
          configMap:
            name: {{ include "insighthub.fullname" . }}-day4-chaos
      {{- end }}
