apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-demo
  namespace: insighthub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-demo
  template:
    metadata:
      labels:
        app: metrics-demo
    spec:
      containers:
        - name: app
          image: quay.io/brancz/prometheus-example-app:v0.5.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-demo
  namespace: insighthub
spec:
  selector:
    app: metrics-demo
  ports:
    - name: metrics
      port: 8088
      targetPort: 8080